# How often CI runs is limited by OD-09 and OD-14 (GitHub-hosted minutes):
# a push to main or a tag runs the pinned full build, unit tests and lint, then the desktop harnesses and the
# real-server checks; a push that changes only Markdown or docs/ starts no run. Emulator tests run on tags and
# manual runs. Other branches run only when dispatched (gh workflow run android-ci.yml --ref <branch>).
# A release is made only from a green run.
name: Android CI

on:
  push:
    branches: [main]
    tags: ['**']
    # GitHub does not apply path filters to tag pushes, so every tag runs.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      revision:
        description: Tag or commit to test (empty = the branch it runs on)
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build, unit tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The revision is resolved once, here, to a commit; every other job checks out that commit, so all of them test
    # (and the release job signs) the same source even if a branch named in the input moves during the run.
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Record the revision under test
        id: revision
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::Revision under test $(git rev-parse HEAD) ($(git describe --tags --always))"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug (compile gate)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee -a ci-build.log
      - name: JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee -a ci-build.log
      - name: Compile instrumented tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee -a ci-build.log
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee -a ci-build.log
      - name: Report JVM unit test counts
        if: always()
        run: python3 tools/ci/junit_counts.py --annotate app/build/test-results
      - name: Report lint results
        if: always()
        run: python3 .github/scripts/lint_summary.py app/build/reports/lint-results-debug.xml
      - name: Annotate first build errors
        if: failure()
        run: python3 .github/scripts/annotate_failures.py "Build, unit tests, lint" ci-build.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-unit-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # One job for the harnesses and both real-server locales (OD-14): each was under a minute and GitHub bills every
  # job rounded up to a whole minute. It starts only after the build passes, so a broken build spends nothing more.
  harness-and-real-server:
    name: Desktop harnesses and real-server integration (pinned kotlinc 2.1.20, LubeLogger 1.7.4)
    runs-on: ubuntu-24.04
    needs: build-and-unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-unit.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned kotlinc 2.1.20
        run: |
          curl -fsSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          echo "a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d /tmp && echo "/tmp/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Source contracts (text checks only)
        shell: bash
        run: |
          set -o pipefail
          python3 tests/source_contracts.py 2>&1 | tee -a ci-harness.log
      - name: Release signing script (synthetic inputs, no key, no build)
        shell: bash
        run: |
          set -o pipefail
          python3 tests/release_signing_check.py 2>&1 | tee -a ci-harness.log
      - name: Offline domain checks and streaming probe
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-offline-tests.sh 2>&1 | tee -a ci-harness.log
      - name: Production clients against synthetic HTTPS server
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-network-tests.sh 2>&1 | tee -a ci-harness.log
      - name: Annotate first harness errors
        if: failure()
        run: python3 .github/scripts/annotate_failures.py "Desktop harnesses" ci-harness.log
      # de_DE parses decimal strings with a comma; both must store the same values. Each locale runs even when
      # an earlier step failed, as the separate jobs did.
      - name: Production clients against a disposable LubeLogger (synthetic data, en_US.UTF-8)
        id: real-en
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LUBELOGGER_LOCALE: en_US.UTF-8
        run: |
          set -o pipefail
          ./scripts/run-integration-tests.sh 2>&1 | tee -a ci-real-server-en_US.log
      - name: Production clients against a disposable LubeLogger (synthetic data, de_DE.UTF-8)
        id: real-de
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LUBELOGGER_LOCALE: de_DE.UTF-8
        run: |
          set -o pipefail
          ./scripts/run-integration-tests.sh 2>&1 | tee -a ci-real-server-de_DE.log
      - name: Report real-server scenario counts
        if: ${{ !cancelled() }}
        run: |
          for locale in en_US de_DE; do
            line=$(grep -sE '^Passed [0-9]+ real-server' "ci-real-server-$locale.log" || echo 'Real-server scenarios: not completed')
            echo "::notice title=Real-server integration ($locale.UTF-8)::$line"
          done
      - name: Annotate first real-server errors (en_US.UTF-8)
        if: ${{ !cancelled() && steps.real-en.outcome == 'failure' }}
        run: python3 .github/scripts/annotate_failures.py "Real-server integration (en_US.UTF-8)" ci-real-server-en_US.log
      - name: Annotate first real-server errors (de_DE.UTF-8)
        if: ${{ !cancelled() && steps.real-de.outcome == 'failure' }}
        run: python3 .github/scripts/annotate_failures.py "Real-server integration (de_DE.UTF-8)" ci-real-server-de_DE.log

  instrumented:
    name: Instrumented tests (API 35 emulator)
    # The most expensive job (OD-09, OD-14): tags and manual runs only, not every push to main.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: build-and-unit
    timeout-minutes: 75
    steps:
      # The emulator needs about 7.4 GB for its data partition; the runner's free space was 0.2 GB short once the
      # Gradle cache carried Robolectric's SDK jars. Tools this project never uses are removed first.
      - name: Free disk space for the emulator
        run: |
          df -h / | tail -1 | awk '{print "Free before: " $4}'
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1 | awk '{print "Free after: " $4}'
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-unit.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator image (the device data is still wiped every run)
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-pixel_6
      - name: Create the emulator snapshot-free image
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: false
          script: echo "Emulator image created"
      - name: Run connectedDebugAndroidTest on a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: false
          emulator-boot-timeout: 900
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -wipe-data
          script: bash -c "set -o pipefail; ./gradlew --no-daemon :app:connectedDebugAndroidTest 2>&1 | tee -a ci-instrumented.log"
      - name: Report measurements logged by instrumented tests
        if: always()
        run: |
          grep -rhoE "AlertTapTiming[^\r]*posts=.*" app/build/outputs/androidTest-results 2>/dev/null | head -3 |
            sed 's/^/::notice title=Main-thread wait::/' || true
          grep -rhoE "AlertActionTiming[^\r]*action=.*" app/build/outputs/androidTest-results 2>/dev/null | sort -u | head -8 |
            sed 's/^/::notice title=Main-thread actions::/' || true
      - name: Report instrumented test counts
        if: always()
        run: python3 tools/ci/junit_counts.py --annotate app/build/outputs/androidTest-results
      - name: Annotate first instrumented errors
        if: failure()
        run: python3 .github/scripts/annotate_failures.py "Instrumented tests" ci-instrumented.log
      - name: Upload the screenshot run (realistic synthetic garage, normal and largest text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # Signed release (OD-64): an APK to install and an Android App Bundle, on tags only (a tag's run is started by hand
  # on refs/tags/...), in its own job so no other job sees the signing secrets. It builds from the tag's own
  # source with the Gradle cache off, so nothing another job or run wrote goes into the signed files. It signs only
  # when the commit the build job tested is the tag's own commit (a run started with a different revision signs
  # nothing and fails here): checked by this job's first step, before checkout, and again by the script. The steps and
  # checks are in scripts/build-signed-release.sh: the key exists in the runner's temporary folder for this build only,
  # both files must carry the key's certificate, and the run notice names its SHA-256 fingerprint. Without the secrets
  # a tag gets no signed release, and a notice says so.
  release:
    name: Signed release APK and bundle
    runs-on: ubuntu-24.04
    # Signs only when every test job passed (LL-03): a failed harness, real-server or emulator job means no APK.
    needs: [build-and-unit, harness-and-real-server, instrumented]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build-and-unit.result == 'success' && needs.harness-and-real-server.result == 'success' && needs.instrumented.result == 'success' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checked here, in this workflow, before anything is checked out: the script below comes from the checked-out
      # revision, and an older one would not check. A run started on a tag with a different revision fails here.
      - name: Sign only the tag's own commit
        env:
          RESOLVED_COMMIT: ${{ needs.build-and-unit.outputs.commit }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$RESOLVED_COMMIT" ] || [ "$RESOLVED_COMMIT" != "$TAG_COMMIT" ]; then
            echo "::error::This run tested ${RESOLVED_COMMIT:-no commit}, not the tag's commit $TAG_COMMIT: nothing is signed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-unit.outputs.commit }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build and check the signed release
        env:
          LUBELINK_RELEASE_KEYSTORE_B64: ${{ secrets.LUBELINK_RELEASE_KEYSTORE_B64 }}
          LUBELINK_RELEASE_STORE_PASSWORD: ${{ secrets.LUBELINK_RELEASE_STORE_PASSWORD }}
          LUBELINK_RELEASE_KEY_ALIAS: ${{ secrets.LUBELINK_RELEASE_KEY_ALIAS }}
          LUBELINK_RELEASE_KEY_PASSWORD: ${{ secrets.LUBELINK_RELEASE_KEY_PASSWORD }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/build-signed-release.sh release-out "$TAG_COMMIT"
          if ls release-out/*.apk > /dev/null 2>&1; then echo "SIGNED_RELEASE=yes" >> "$GITHUB_ENV"; fi
      - name: Upload the signed release
        if: ${{ env.SIGNED_RELEASE == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release-out/
          retention-days: 90
          if-no-files-found: error
