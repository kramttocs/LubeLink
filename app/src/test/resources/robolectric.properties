# The JVM screen matches the CI emulator's Pixel 6 (411 x 914 dp at 420 dpi), so the same items are on screen.
sdk=36
qualifiers=w411dp-h914dp-port-420dpi
# Installs a software stand-in for the Android Keystore, which Robolectric does not provide.
application=com.kramttocs.lubelink.quality.JvmTestApplication
# Real text measurement and drawing (the default stub measures every glyph as about one pixel).
graphicsMode=NATIVE
# Lays out dialog windows at the screen's size so a dialog with a text field becomes idle (see the class).
shadows=com.kramttocs.lubelink.quality.JvmDialogWindowShadow
